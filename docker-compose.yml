x-airflow-common:
  &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    #AIRFLOW__WEBSERVER__SECRET_KEY: "465d203ff25047604e7a54809a9f7790d3c2ccba0ba30927106cf5f37c9a4bfc"
    AIRFLOW__WEBSERVER__SECRET_KEY: "${AIRFLOW__WEBSERVER__SECRET_KEY}"
    PYTHONPATH: /opt/airflow
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_DB: "${POSTGRES_DB}"
    POSTGRES_USER: "${POSTGRES_USER}"
    POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    # --- NOVA VARIÁVEL PARA O OLLAMA ---
    OLLAMA_BASE_URL: http://host.docker.internal:11434
  # --- ADICIONADO PARA MAPEAMENTO DE REDE ---
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./etl:/opt/airflow/etl
    - ./ai:/opt/airflow/ai
    - ./sql:/opt/airflow/sql
    - ./data:/opt/airflow/data
  depends_on:
    - airflow-postgres

services:

  # ======================
  # Data Warehouse
  # ======================
  postgres:
    image: postgres:15
    container_name: data_warehouse_postgres
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_dw_data:/var/lib/postgresql/data

  # ======================
  # Airflow Metadata DB
  # ======================
  airflow-postgres:
    image: postgres:15
    container_name: airflow_postgres
    environment:
      POSTGRES_USER: "${AIRFLOW_POSTGRES_USER}"
      POSTGRES_PASSWORD: "${AIRFLOW_POSTGRES_PASSWORD}"
      POSTGRES_DB: "${AIRFLOW_POSTGRES_DB}"
    volumes:
      - postgres_airflow_data:/var/lib/postgresql/data

  # ======================
  # Airflow Webserver
  # ======================
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      - airflow-scheduler
    restart: always

  # ======================
  # Airflow Scheduler
  # ======================
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow_scheduler
    command: scheduler
    restart: always

volumes:
  postgres_dw_data:
  postgres_airflow_data: